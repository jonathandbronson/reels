<!doctype html>
<html lang="en" data-resolution="portrait">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="assets/vendor/gsap.min.js"></script>
    <style>
      :root {
        --ground: #1d3fd8;
        --ink: #ffffff;
        --accent: #ffd43b;
        --font-display: "Inter", sans-serif;
      }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body {
        width: 1080px;
        height: 1920px;
        overflow: hidden;
        background: var(--ground);
      }
      #root { position: relative; width: 100%; height: 100%; font-family: var(--font-display); }
      #shot {
        position: absolute;
        left: 150px;
        top: 620px;
        width: 780px;
        height: 600px;
        object-fit: cover;
        border-radius: 36px;
      }
      .scene { position: absolute; inset: 0; }
    </style>
  </head>
  <body>
    <!-- Timing comes from assets/source/voice/timing.json (tools/voice.py). -->
    <div id="root" data-composition-id="main" data-start="0" data-duration="11.6" data-width="1080" data-height="1920">
      <!-- Blender shot (3 s) slowed to span the hook and flood scenes -->
      <video id="shot" class="clip" src="assets/blender/liner.mp4" muted
        data-start="0" data-duration="7.89" data-playback-rate="0.38" data-track-index="0"></video>

      <div id="hook" data-composition-id="hook" class="scene clip" data-composition-src="compositions/hook.html"
        data-start="0" data-duration="4.38" data-track-index="1" data-track-kind="graphics"
        data-width="1080" data-height="1920"></div>
      <div id="flood" data-composition-id="flood" class="scene clip" data-composition-src="compositions/flood.html"
        data-start="4.38" data-duration="3.51" data-track-index="1" data-track-kind="graphics"
        data-width="1080" data-height="1920"></div>
      <div id="payoff" data-composition-id="payoff" class="scene clip" data-composition-src="compositions/payoff.html"
        data-start="7.89" data-duration="3.71" data-track-index="1" data-track-kind="graphics"
        data-width="1080" data-height="1920"></div>

      <audio id="vo" class="clip" src="assets/source/voice/vo.wav" data-start="0" data-duration="10.88" data-track-index="2"></audio>
      <audio id="sfx-whoosh1" class="clip" src="assets/source/sounds/whoosh.wav" data-start="3.9" data-duration="0.6" data-volume="0.5" data-track-index="3"></audio>
      <audio id="sfx-hit1" class="clip" src="assets/source/sounds/hit.wav" data-start="4.38" data-duration="0.5" data-volume="1.4" data-track-index="4"></audio>
      <audio id="sfx-whoosh2" class="clip" src="assets/source/sounds/whoosh.wav" data-start="7.41" data-duration="0.6" data-volume="0.5" data-track-index="3"></audio>
      <audio id="sfx-hit2" class="clip" src="assets/source/sounds/hit.wav" data-start="7.89" data-duration="0.5" data-volume="1.4" data-track-index="4"></audio>
    </div>
    <script>
      const tl = gsap.timeline({ paused: true });
      tl.fromTo("#shot", { scale: 1.08 }, { scale: 1, duration: 7.89, ease: "none" }, 0);
      window.__timelines["main"] = tl;
      tl.seek(0);
    </script>
  </body>
</html>
